[package]
name    = "recipe_web"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus         = { version = "0.7", features = ["web"] }
serde          = { version = "1",   features = ["derive"] }
diesel         = { version = "2",   features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
sqlite-wasm-rs = { version = "0.5", default-features = false }
gloo-timers     = "0.3"

[profile.release]
opt-level = "z"
